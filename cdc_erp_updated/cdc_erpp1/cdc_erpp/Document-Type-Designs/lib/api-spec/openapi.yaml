openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: CDC ERP System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: children
    description: Child profile management
  - name: cases
    description: Case file management
  - name: health-assessments
    description: Health assessment records
  - name: counseling
    description: Counseling session records
  - name: guardians
    description: Guardian master records
  - name: guardian-visits
    description: Guardian visit logs
  - name: court-cases
    description: Court case management
  - name: police-acquisitions
    description: Police acquisition forms
  - name: education
    description: Education & skill plans
  - name: release-records
    description: Release documentation
  - name: follow-ups
    description: Follow-up logs
  - name: admissions
    description: Admission records
  - name: offences
    description: Offence details
  - name: court-references
    description: Court references
  - name: allocations
    description: Center/unit/bed allocations
  - name: transfers
    description: Inter-center transfers
  - name: risk-assessments
    description: Risk & vulnerability assessments
  - name: dashboard
    description: Dashboard statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Dashboard
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/children-by-status:
    get:
      operationId: getChildrenByStatus
      tags: [dashboard]
      summary: Get children grouped by status
      responses:
        "200":
          description: Children grouped by status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusCount"

  # Children
  /children:
    get:
      operationId: listChildren
      tags: [children]
      summary: List all children
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of children
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildListResponse"
    post:
      operationId: createChild
      tags: [children]
      summary: Create a new child profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChildBody"
      responses:
        "201":
          description: Created child
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"

  /children/{id}:
    get:
      operationId: getChild
      tags: [children]
      summary: Get a child profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Child profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateChild
      tags: [children]
      summary: Update a child profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChildBody"
      responses:
        "200":
          description: Updated child
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
    delete:
      operationId: deleteChild
      tags: [children]
      summary: Delete a child profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # Cases
  /cases:
    get:
      operationId: listCases
      tags: [cases]
      summary: List all case files
      parameters:
        - name: childId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseFile"
    post:
      operationId: createCase
      tags: [cases]
      summary: Create a new case file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseBody"
      responses:
        "201":
          description: Created case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseFile"

  /cases/{id}:
    get:
      operationId: getCase
      tags: [cases]
      summary: Get a case file by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Case file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseFile"
    put:
      operationId: updateCase
      tags: [cases]
      summary: Update a case file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseBody"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseFile"


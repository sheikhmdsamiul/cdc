          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtCase"

  /court-cases/bulk-import:
    post:
      operationId: bulkImportCourtCases
      tags: [court-cases]
      summary: Bulk import court cases from CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file containing court case data
      responses:
        "200":
          description: Bulk import results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                    description: Number of successfully imported records
                  errors:
                    type: array
                    items:
                      type: string
                    description: List of error messages for failed imports
                  total:
                    type: integer
                    description: Total number of records processed


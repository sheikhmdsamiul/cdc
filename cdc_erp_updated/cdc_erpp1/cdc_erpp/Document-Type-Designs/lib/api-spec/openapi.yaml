      tags: [admin]
      summary: Get the nested tree of administrative units
      responses:
        "200":
          description: Tree of administrative units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DivisionNode"
  /admin-units:
    post:
      operationId: createAdministrativeUnit
      tags: [admin]
      summary: Create an administrative unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUnitBody"
      responses:
        "201":
          description: Created unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministrativeUnit"

